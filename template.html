<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="author" content="Simon Bracegirdle" />
    <link rel="canonical" href="{{canonical}}" />
    <meta property="og:type" content="{{ogtype}}" />
    <meta property="og:site_name" content="LetsBuild.cloud" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="{{canonical}}" />
    <meta name="twitter:card" content="summary" />
    {{head_extra}}
    <link rel="stylesheet" href="/theme.css" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="LetsBuild.cloud"
      href="/feed.xml"
    />
  </head>
  <body>
    <header>
      <div class="statusline">
        <a class="seg seg-a" href="/">simon@letsbuild</a>
        <a class="seg seg-b" href="/">~/blog</a>
        <span class="fill"></span>
        <span class="seg seg-c seg-shrink" title="{{file}}">{{file}}</span>
        <span class="seg seg-b">utf-8</span>
      </div>
    </header>
    <h1>{{heading}}</h1>
    <a href="/" class="prompt">Simon's Blog — LetsBuild.cloud<span class="cursor" aria-hidden="true"></span></a>
    <main>{{content}}</main>
    <footer>
      <div class="statusline">
        <span class="seg seg-a">eof</span>
        <a class="seg seg-b seg-grow" href="/2025-03-01-simplest-static-site-generator.html" title="built with the world's simplest static site generator">built with the world's simplest static site generator</a>
        <a class="seg seg-b" href="#top">&uarr; top</a>
        <a class="seg seg-b" href="/">~/blog</a>
        <a class="seg seg-b" href="/tags.html">tags</a>
        <a class="seg seg-b" href="/feed.xml">feed</a>
        <a class="seg seg-b" href="/style-guide.html">style guide</a>
      </div>
    </footer>
  </body>
</html>
