<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <style>
      :root {
        /* ── Colour palette (light — gruvbox light) ──────────── */
        --color-bg: #f4f3ef;
        --color-text: #322f2c;
        --color-muted: #807d76;
        --color-accent: #427b58;
        --color-accent-hover: #2f5e47;
        --color-code-bg: #eae9e3;
        --color-border: #d6d4cd;
        --color-panel-bg: #ecebe4;

        /* ── Gruvbox accent colours (divider + accents) ─────── */
        --c-red: #cc241d;
        --c-green: #98971a;
        --c-yellow: #d79921;
        --c-blue: #458588;
        --c-purple: #b16286;
        --c-aqua: #689d6a;
        --c-orange: #d65d0e;

        /* ── Font families (monospace throughout — TUI) ──────── */
        --font-serif: "JetBrains Mono", "Fira Code", "Cascadia Code",
          "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono",
          monospace;
        --font-sans: "JetBrains Mono", "Fira Code", "Cascadia Code",
          "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono",
          monospace;
        --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code",
          "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono",
          monospace;

        /* ── Type scale (tightened for monospace widths) ─────── */
        --text-xs: 0.8rem;
        --text-sm: 0.9rem;
        --text-base: 1rem;
        --text-lg: 1.2rem;
        --text-xl: 1.4rem;
        --text-2xl: 1.75rem;

        /* ── Line height & tracking ─────────────────────────────── */
        --leading-tight: 1.3;
        --leading-normal: 1.7;
        --tracking-tight: -0.01em;

        /* ── Font weights ─────────────────────────────────────── */
        --weight-normal: 400;
        --weight-medium: 600;
        --weight-bold: 700;

        /* ── Spacing scale ────────────────────────────────────── */
        --space-1: 0.25rem;
        --space-2: 0.5rem;
        --space-3: 1rem;
        --space-4: 1.5rem;
        --space-5: 2.5rem;
        --space-6: 3.5rem;

        /* ── Layout, borders, radii, motion ───────────────────── */
        --layout-width: 760px;
        --layout-pad-y: 2.5rem;
        --layout-pad-x: 1.5rem;
        --border-width: 1px;
        --radius: 0px;
        --transition: 0.15s ease;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #141414;
          --color-text: #d8d5ce;
          --color-muted: #8a8780;
          --color-accent: #b8bb26;
          --color-accent-hover: #d7d99e;
          --color-code-bg: #1f1f1f;
          --color-border: #303030;
          --color-panel-bg: #1f1f1f;
        }
      }

      html {
        background-color: var(--color-bg);
      }

      body {
        font-family: var(--font-sans);
        font-size: var(--text-base);
        line-height: var(--leading-normal);
        max-width: var(--layout-width);
        margin: 0 auto;
        padding: var(--layout-pad-y) var(--layout-pad-x);
        color: var(--color-text);
        background-color: var(--color-bg);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-serif);
        line-height: var(--leading-tight);
        letter-spacing: var(--tracking-tight);
      }
      h1 {
        margin: var(--space-2) 0 var(--space-4);
        font-size: var(--text-2xl);
        padding-bottom: var(--space-2);
        border-bottom: var(--border-width) solid var(--c-green);
      }
      h1::before {
        content: "■  ";
        color: var(--c-green);
        font-size: var(--text-xl);
        vertical-align: middle;
      }
      h1:empty {
        display: none;
      }
      h2 {
        font-size: var(--text-xl);
        padding-bottom: var(--space-1);
        border-bottom: 1px solid var(--c-blue);
      }
      h2::before {
        content: "▸ ";
        color: var(--c-blue);
      }
      h3 {
        font-size: var(--text-lg);
      }
      h3::before {
        content: "› ";
        color: var(--c-yellow);
      }
      a {
        color: var(--color-accent);
        text-decoration: none;
        border-bottom: var(--border-width) solid transparent;
        transition: border-color var(--transition), color var(--transition);
      }
      a:hover {
        color: var(--color-accent-hover);
        border-bottom-color: currentColor;
      }
      pre,
      code {
        font-family: var(--font-mono);
        background-color: var(--color-code-bg);
        border-radius: var(--radius);
        padding: 0.15em 0.4em;
        font-size: 0.9em;
      }
      code {
        border: var(--border-width) solid var(--color-border);
      }
      pre code {
        padding: 0;
        background: none;
        border: none;
      }
      pre {
        padding: var(--space-3);
        overflow: auto;
        border: var(--border-width) solid var(--color-border);
        border-left: 3px solid var(--c-aqua);
      }
      blockquote {
        margin: var(--space-3) 0;
        padding: var(--space-1) var(--space-3);
        border-left: 3px solid var(--c-orange);
        color: var(--color-muted);
      }

      header {
        margin-bottom: var(--space-3);
      }
      .divider {
        display: flex;
        font-family: var(--font-mono);
        font-size: var(--text-base);
        line-height: 1;
        margin: 0 0 var(--space-5);
        user-select: none;
      }
      .divider span {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
      }
      .divider .c1 { color: var(--c-red); }
      .divider .c2 { color: var(--c-green); }
      .divider .c3 { color: var(--c-yellow); }
      .divider .c4 { color: var(--c-blue); }
      .divider .c5 { color: var(--c-purple); }
      .divider .c6 { color: var(--c-aqua); }
      .divider .c7 { color: var(--c-orange); }
      .site-title {
        font-size: var(--text-sm);
        font-weight: var(--weight-medium);
        color: var(--color-muted);
        text-decoration: none;
        display: inline-block;
        border-bottom: none;
      }
      .site-title:hover {
        color: var(--color-accent);
      }
      .site-title::before {
        content: "❯";
        color: var(--color-accent);
        margin-right: var(--space-2);
        font-family: var(--font-mono);
      }
      .site-title::after {
        content: "█";
        color: var(--color-accent);
        margin-left: var(--space-1);
        animation: cursor-blink 1.1s step-end infinite;
      }
      @keyframes cursor-blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .site-title::after {
          animation: none;
        }
      }

      footer {
        margin-top: var(--space-6);
        padding-top: var(--space-4);
        border-top: var(--border-width) solid var(--color-border);
        font-size: var(--text-xs);
        color: var(--color-muted);
      }
      footer a {
        color: var(--color-muted);
      }
      footer a:hover {
        color: var(--color-accent);
      }

      .post-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .post-list li {
        padding: var(--space-2) 0;
        border-bottom: 1px dashed var(--color-border);
      }
      .post-list li:last-child {
        border-bottom: none;
      }
      .post-list li::before {
        content: "›";
        color: var(--color-accent);
        font-weight: var(--weight-bold);
        margin-right: var(--space-2);
      }
      .post-list li:nth-child(7n+1)::before { color: var(--c-red); }
      .post-list li:nth-child(7n+2)::before { color: var(--c-green); }
      .post-list li:nth-child(7n+3)::before { color: var(--c-yellow); }
      .post-list li:nth-child(7n+4)::before { color: var(--c-blue); }
      .post-list li:nth-child(7n+5)::before { color: var(--c-purple); }
      .post-list li:nth-child(7n+6)::before { color: var(--c-aqua); }
      .post-list li:nth-child(7n+7)::before { color: var(--c-orange); }
      .post-list strong {
        font-weight: var(--weight-medium);
        color: var(--color-muted);
      }
      .post-list p {
        margin: var(--space-1) 0 0;
        padding-left: var(--space-3);
        font-size: var(--text-xs);
        color: var(--color-muted);
      }

      .reading {
        margin: 0 0 var(--space-4);
        margin-left: calc(-1 * var(--layout-pad-x));
        margin-right: calc(-1 * var(--layout-pad-x));
        background-color: var(--color-panel-bg);
        padding: var(--space-3) var(--layout-pad-x);
      }
      .shelf {
        margin-top: var(--space-3);
      }
      .shelf-label {
        font-family: var(--font-sans);
        font-size: var(--text-xs);
        font-weight: var(--weight-bold);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-text);
        margin: 0 0 var(--space-1);
      }
      .shelf-label::before {
        content: "■ ";
      }
      .shelf:nth-of-type(1) .shelf-label::before { color: var(--c-red); }
      .shelf:nth-of-type(2) .shelf-label::before { color: var(--c-green); }
      .shelf:nth-of-type(3) .shelf-label::before { color: var(--c-yellow); }
      .book-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-3);
      }
      .book {
        display: flex;
        gap: var(--space-2);
        align-items: flex-start;
        max-width: 210px;
      }
      .book-link {
        display: flex;
        gap: var(--space-2);
        align-items: flex-start;
        color: inherit;
        border-bottom: none;
      }
      .book-link:hover {
        color: inherit;
        border-bottom-color: transparent;
      }
      .book-link:hover .book-title {
        color: var(--color-accent);
      }
      .book-cover {
        width: 44px;
        height: auto;
        flex-shrink: 0;
        border-radius: var(--radius);
        border: var(--border-width) solid var(--c-blue);
      }
      .book-meta {
        display: flex;
        flex-direction: column;
        font-size: var(--text-xs);
        line-height: var(--leading-tight);
      }
      .book-title {
        font-weight: var(--weight-medium);
      }
      .book-author {
        color: var(--color-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="site-title">Simon's Blog — LetsBuild.cloud</a>
    </header>
    <div class="divider" aria-hidden="true"><span class="c1">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c2">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c3">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c4">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c5">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c6">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span><span class="c7">█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓█▓▒░▒▓</span></div>
    <h1>{{heading}}</h1>
    <main>{{content}}</main>
    <footer>
      <a href="/2025-03-01-simplest-static-site-generator">
        Generated with the world's simplest static site generator in Go.
      </a>
    </footer>
  </body>
</html>
