<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="/theme.css" />
  </head>
  <body>
    <header>
      <div class="statusline" aria-label="Site header">
        <a class="seg seg-a" href="/">simon@letsbuild</a>
        <a class="seg seg-b" href="/">~/blog</a>
        <span class="fill"></span>
        <span class="seg seg-c">{{file}}</span>
        <span class="seg seg-b">utf-8</span>
      </div>
    </header>
    <h1>{{heading}}</h1>
    <a href="/" class="prompt">Simon's Blog — LetsBuild.cloud<span class="cursor" aria-hidden="true"></span></a>
    <main>{{content}}</main>
    <footer>
      <div class="statusline">
        <span class="seg seg-a">eof</span>
        <a class="seg seg-b" href="/2025-03-01-simplest-static-site-generator">built with the world's simplest static site generator</a>
        <span class="fill"></span>
        <a class="seg seg-b" href="#top">&uarr; top</a>
        <a class="seg seg-b" href="/">~/blog</a>
        <a class="seg seg-b" href="/style-guide.html">style guide</a>
      </div>
    </footer>
  </body>
</html>
